# Standalone dev/CI file, not a production override. Never mounts a source tree or existing Qwerte data.
#
# Frontend development (React/TypeScript storefront in web/):
#   1. Start the backend: ./gradlew --no-daemon -p stash-manager-server build, then run the
#      Manager (or `docker compose -f compose.dev.yaml up --build manager`) on 127.0.0.1:8765.
#   2. In web/: `bun install --frozen-lockfile && bun run dev` (Vite HMR on :5173).
#   Vite proxies /api, /dirt.png and /icons* to the Manager, preserving Host/Origin/CSRF
#   behavior. No permissive production CORS is introduced. Production serves the
#   compiled bundle from Java (single container, see Dockerfile + docs/WEB_ARCHITECTURE.md).
name: wesort-dev
services:
  manager:
    image: ${WESORT_DEV_IMAGE:-wesort-manager:dev}
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${WESORT_PORT:-8765}:8765"
    environment:
      WESORT_ALLOWED_HOSTS: ${WESORT_ALLOWED_HOSTS:-}
      WESORT_TRUSTED_PROXIES: ${WESORT_TRUSTED_PROXIES:-}
      WESORT_SECURE_COOKIES: "false"
      WESORT_EULA: ${WESORT_EULA:-}
    volumes:
      - wesort-data:/var/lib/wesort
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
volumes:
  wesort-data:
