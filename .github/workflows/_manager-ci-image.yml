name: WeSort Manager CI image
on:
  workflow_call:
permissions:
  contents: read
jobs:
  manager-image:
    # Export the exact image before starting independent browser and Minecraft tests.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wesort-manager:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: Export the exact image built from this revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager-ci-image"
          docker image inspect wesort-manager:ci --format '{{.Id}}' > "$RUNNER_TEMP/manager-ci-image/image-id.txt"
          docker save wesort-manager:ci | zstd -T0 -1 -o "$RUNNER_TEMP/manager-ci-image/manager.tar.zst"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: manager-ci-image-${{ github.run_id }}
          path: '${{ runner.temp }}/manager-ci-image/'
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error
