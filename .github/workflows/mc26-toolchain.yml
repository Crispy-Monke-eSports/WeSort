name: Minecraft 26.3 toolchain
on:
  push:
    paths: ['tools/mc26-toolchain/**', '.github/workflows/mc26-toolchain.yml']
  pull_request:
    paths: ['tools/mc26-toolchain/**', '.github/workflows/mc26-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimal-addon-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libopenal1
      - name: Build and start actual Minecraft with Meteor and Baritone
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/mc26-toolchain/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc26-toolchain-${{ github.sha }}
          path: |
            tools/mc26-toolchain/build/evidence/
            tools/mc26-toolchain/build/probe-run/logs/
            tools/mc26-toolchain/build/probe-run/crash-reports/
