name: Minecraft 26.3 kits
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build current-commit Manager once for all kits scenarios
        shell: bash
        run: |
          # Maven Central rate-limits large matrix bursts. Retry only a bounded
          # image build; every scenario below consumes these exact same bits.
          for attempt in 1 2 3; do
            if docker buildx build --load --build-arg REVISION="$GITHUB_SHA" \
                --cache-from type=gha,scope=manager \
                --cache-to type=gha,mode=max,scope=manager \
                -t wesort-manager:kit-tests .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Package exact Manager image for matrix jobs
        run: docker save wesort-manager:kit-tests | gzip -1 > "$RUNNER_TEMP/wesort-manager.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: mc26-kits-manager-image-${{ github.sha }}
          path: ${{ runner.temp }}/wesort-manager.tar.gz
          compression-level: 0
          retention-days: 1

  kits:
    needs: manager-image
    strategy:
      fail-fast: false
      matrix:
        scenario: [pack, partial, repeat, repeat-version, variant, reserved, abort, offline, version, restart]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libopenal1
      - name: Download the identical tested Manager image
        uses: actions/download-artifact@v4
        with:
          name: mc26-kits-manager-image-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Load Manager image from current commit
        run: gzip -dc "$RUNNER_TEMP/wesort-manager.tar.gz" | docker load
      - name: Manager-owned exact kit job and physical server receipt
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/mc26/kit-harness.py --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc26-kits-${{ matrix.scenario }}-${{ github.sha }}
          path: build/mc26-e2e-*/evidence/
