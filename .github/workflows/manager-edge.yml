name: Manager edge
on:
  workflow_run:
    workflows: [WeSort CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read

# One push to main moves :edge exactly once, in order. Never auto-cancel a
# publication that already started pushing.
concurrency:
  group: wesort-manager-edge
  cancel-in-progress: false

jobs:
  edge:
    # Only real pushes to main move :edge: scheduled or manual CI reruns on the
    # same SHA must not republish, and forks must never touch the registry.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'Crispy-Monke-eSports/WeSort'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY: ghcr.io/crispy-monke-esports/wesort-manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Verify publication guards without registry credentials
        run: python3 scripts/release/test_guards.py
      - id: metadata
        env:
          GITHUB_SHA: ${{ env.HEAD_SHA }}
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
        run: python3 scripts/release/metadata.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: wesort-manager:edge-candidate
          build-args: |
            REVISION=${{ env.HEAD_SHA }}
            VERSION=${{ steps.metadata.outputs.app_version }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: Test exact candidate before granting package-write permission
        run: |
          mkdir -p build/edge
          python3 scripts/docker-smoke.py --image wesort-manager:edge-candidate --report build/edge/docker-smoke.json
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the tested candidate as edge and push
        run: |
          set -euo pipefail
          revision="$(docker image inspect wesort-manager:edge-candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$revision" = "$HEAD_SHA"
          docker tag wesort-manager:edge-candidate "$REGISTRY:edge"
          docker push "$REGISTRY:edge"
          digest="$(docker image inspect "$REGISTRY:edge" --format '{{index .RepoDigests 0}}')"
          mkdir -p build/edge
          python3 - "$digest" <<'EOF'
          import json, os, sys
          Path = __import__('pathlib').Path
          Path('build/edge/edge.json').write_text(json.dumps({
              'tag': 'edge',
              'sha': os.environ['HEAD_SHA'],
              'digest': sys.argv[1],
          }, indent=2) + '\n')
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: manager-edge-${{ env.HEAD_SHA }}
          path: build/edge/
          overwrite: true
