name: Minecraft 26.3 assets and UI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci --prefix web-tests
      - name: Install software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libopenal1
      - name: Compare generated resources with actual vanilla game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/mc26/metadata-harness.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wesort-manager:mc26-tests
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: Real fresh scan, Docker icons, web API/DOM and in-game window
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
          NODE_PATH: ${{ github.workspace }}/web-tests/node_modules
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/mc26/assets-harness.py --manager-image wesort-manager:mc26-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc26-assets-${{ github.sha }}
          path: build/mc26-e2e-*/evidence/
