<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1066.4"
     viewBox="0 0 1200 1066.4" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">WE – WeSort with SORT caption</title>
  <desc id="logo-desc">Separerade vita pixelbokstäver W och E mot färgad skylt med utåtvända, trappstegsformade stenhörn.</desc>
  <!-- BYT DOTTERBOLAGSFÄRG: ändra endast fill på path#brand-color. -->
  <defs>
    <linearGradient id="brand-shading" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".085"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".14"/>
    </linearGradient>
    <filter id="sort-caption-shadow" x="-25%" y="-80%" width="150%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22.06" result="blur"/>
      <feOffset in="blur" dx="0" dy="17.65" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity=".6" result="black"/>
      <feComposite in="black" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .letter-shadow { fill: #2A1818; opacity: .24; }
    .letter-extrusion { fill: #C9C2BD; }
  </style>
  <g id="brand-sign">
    <path id="brand-shadow" d="M215 90 H985 V200 H1092 V632 H985 V740 H215 V632 H108 V200 H215 Z" transform="translate(13 17)" fill="#171413" opacity=".19"/>
    <path id="brand-color" d="M215 90 H985 V200 H1092 V632 H985 V740 H215 V632 H108 V200 H215 Z" fill="#E66A00"/>
    <path id="brand-lighting" d="M215 90 H985 V200 H1092 V632 H985 V740 H215 V632 H108 V200 H215 Z" fill="url(#brand-shading)" pointer-events="none"/>
  </g>
