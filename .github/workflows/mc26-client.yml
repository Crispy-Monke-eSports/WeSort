name: Minecraft 26.3 client
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libopenal1
      - name: Build and start real WeSort client and Stash Window
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/mc26/client-runtime.py
      - name: Summarize unit tests separately
        if: always()
        run: python3 scripts/test-summary.py build >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-26.3-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/test-results/
            build/reports/
            build/evidence/mc26/
            build/run-26.3/logs/
            build/run-26.3/crash-reports/
