name: Set up Minecraft 26.3 E2E runner
description: Pinned Temurin 25, Gradle cache, and software display dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
      with:
        distribution: temurin
        java-version: '25.0.5+8'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
    - name: Install software display dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libopenal1
