name: Baseline build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add 26.3 only after W-013/W-014 verify its toolchain.
        mc: ['1.21.11', '1.21.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test client
        run: ./gradlew --no-daemon clean build -Pmc=${{ matrix.mc }}
      - name: Record tests and build identity
        if: always()
        shell: bash
        run: |
          mkdir -p build/evidence
          {
            echo "commit=$GITHUB_SHA target=${{ matrix.mc }}"
            java -version 2>&1
            ./gradlew --version
            cat .java-version gradle/libs.versions.toml versions/${{ matrix.mc }}.properties
          } > build/evidence/versions.txt
          python3 scripts/test-summary.py build | tee build/evidence/tests.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-${{ matrix.mc }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/test-results/
            build/reports/
            build/evidence/
            LICENSE
            docs/UPSTREAM.md

  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Manager
        run: ./gradlew --no-daemon -p stash-manager-server clean build
      - name: Verify fresh installation, restart and data isolation
        shell: bash
        run: |
          mkdir -p stash-manager-server/build/evidence
          python3 scripts/smoke-isolation.py | tee stash-manager-server/build/evidence/isolation.txt
      - name: Record tests and build identity
        if: always()
        shell: bash
        run: |
          mkdir -p stash-manager-server/build/evidence
          {
            echo "commit=$GITHUB_SHA target=manager"
            java -version 2>&1
            ./gradlew --version
            cat stash-manager-server/build.gradle.kts
          } > stash-manager-server/build/evidence/versions.txt
          python3 scripts/test-summary.py stash-manager-server/build | tee stash-manager-server/build/evidence/tests.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-${{ github.sha }}
          path: |
            stash-manager-server/build/libs/*.jar
            stash-manager-server/build/test-results/
            stash-manager-server/build/reports/
            stash-manager-server/build/evidence/
            LICENSE
            docs/UPSTREAM.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci --prefix web-tests
      - run: npm test --prefix web-tests

  docker:
    needs: manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wesort-manager:dev
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: Docker bridge, bootstrap, persistence and TLS smoke
        run: python3 scripts/docker-smoke.py --report build/evidence/docker-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-${{ github.sha }}
          path: build/evidence/docker-smoke.json

  # W-056 adds a separate trusted release workflow with packages: write.
  # Pull requests and this baseline workflow never publish container images.
