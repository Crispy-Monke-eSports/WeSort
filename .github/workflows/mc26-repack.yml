name: Minecraft 26.3 repack
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repack:
    strategy:
      fail-fast: false
      matrix:
        scenario: [mixed, partial, bulk, compact, no-tool, no-empty, full-stash, lag, abort, reserved, blocked, full-inventory, named, identical, rounds]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/setup-buildx-action@v3
        if: matrix.scenario == 'reserved'
      - uses: docker/build-push-action@v6
        if: matrix.scenario == 'reserved'
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wesort-manager:mc26-tests
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager
      - name: Install software display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libopenal1
      - name: Actual repack phases and authoritative server conservation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/mc26/repack-harness.py --manager-image wesort-manager:mc26-tests --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc26-repack-${{ matrix.scenario }}-${{ github.sha }}
          path: build/mc26-e2e-*/evidence/
