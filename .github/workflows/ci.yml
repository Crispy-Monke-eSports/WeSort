name: WeSort CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      journal_repeats:
        description: 'Journal reliability: runs per phase on the same SHA (manual only)'
        type: choice
        options: ['1', '2', '3']
        default: '1'
  schedule:
    - cron: '29 3 * * *'
  workflow_call:
permissions:
  contents: read

# Distinct event groups and PR numbers; release workflows use their own group.
concurrency:
  group: wesort-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  format:
    name: Java, web and Markdown formatting gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: ./.github/actions/configure-gradle-mirror
      - name: Require formatted Minecraft, shared and toolchain Java
        run: ./gradlew --no-daemon spotlessCheck
      - name: Require formatted Manager Java
        run: ./gradlew --no-daemon -p stash-manager-server spotlessCheck
      - uses: oven-sh/setup-bun@v2
      - name: Install web formatting dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Require formatted web UI and all Markdown
        run: cd web && bun run format:check
  verify:
    name: Compile, unit and Docker smoke
    needs: format
    uses: ./.github/workflows/_verify.yml
    permissions:
      contents: read
  e2e:
    name: Full Minecraft 26.3 E2E
    needs: verify
    uses: ./.github/workflows/_mc26-e2e.yml
    permissions:
      contents: read
    with:
      journal_repeats: ${{ inputs.journal_repeats || '1' }}
  status:
    name: ci-required
    if: always()
    needs: [format, verify, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require verification and every E2E check
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        shell: bash
        run: |
          echo "Java/web/Markdown format: $FORMAT_RESULT; verification: $VERIFY_RESULT; full E2E: $E2E_RESULT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$FORMAT_RESULT" == success && "$VERIFY_RESULT" == success && "$E2E_RESULT" == success ]]
